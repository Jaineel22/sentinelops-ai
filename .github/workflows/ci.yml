name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Phase 10.1: apps/frontend (Next.js). Independent of the Python jobs — lint,
  # type-check, and a production build. No backend needed (build-time only).
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build

  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ml,incident,detector,rca,remediation,mlops]"
      - name: Lint (Ruff)
        run: ruff check .
      - name: Format check (Ruff)
        run: ruff format --check .
      - name: Type-check (mypy)
        run: mypy
      - name: Unit tests (pytest)
        run: pytest

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ml,incident,detector,rca,remediation,mlops]"
      - name: Download NAB benchmark data (best effort)
        run: python -m ml.data.nab download || echo "NAB download failed — Track B tests will skip"
      - name: ML tests
        run: pytest tests/ml -q
      - name: Track A experiments (committed data)
        run: |
          python -m ml.experiments run exp3_comparison_sentinelops
          python -m ml.experiments run exp4_heldout_fault_sentinelops
          test -f artifacts/reports/exp3_comparison_sentinelops/metrics.json
      - name: Track B experiments (if NAB data present)
        run: |
          python -m ml.data.nab download >/dev/null 2>&1 \
            && python -m ml.experiments run exp5_nab_realknowncause \
            && python -m ml.experiments run exp6_nab_realawscloudwatch \
            || echo "skipped Track B (no NAB data)"

  # Phase 6: the MLflow-backed lifecycle end to end against a real Postgres-backed
  # tracking + registry store (the `ml` job already covers the sqlite path).
  # Non-blocking — `mlflow` pulls a large dependency tree and can be slow.
  mlflow-integration:
    name: MLflow integration (Phase 6)
    runs-on: ubuntu-latest
    needs: [quality, ml]
    continue-on-error: true
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sentinelops
          POSTGRES_PASSWORD: sentinelops
          POSTGRES_DB: sentinelops
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U sentinelops -d sentinelops"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      MLFLOW_TRACKING_URI: postgresql://sentinelops:sentinelops@localhost:5432/mlflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ml,incident,detector,rca,remediation,mlops]" psycopg2-binary
      - name: Create the mlflow database
        run: PGPASSWORD=sentinelops psql -h localhost -U sentinelops -c "CREATE DATABASE mlflow"
      - name: Phase 6 marked tests (sqlite fixtures)
        run: pytest -m mlflow -v
      - name: Phase 6 end-to-end demo (Postgres store)
        run: python scripts/phase6_e2e_demo.py

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sentinelops
          POSTGRES_PASSWORD: sentinelops
          POSTGRES_DB: sentinelops
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U sentinelops -d sentinelops"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      KAFKA_BOOTSTRAP_SERVERS: localhost:29092
      DB_URL: postgresql+asyncpg://sentinelops:sentinelops@localhost:5432/sentinelops
      DB_TEST_URL: postgresql+asyncpg://sentinelops:sentinelops@localhost:5432/sentinelops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ml,incident,detector,rca,remediation,mlops]"
      - name: Start Kafka
        run: |
          docker compose up -d kafka
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' sentinelops-ai-kafka-1)" = "healthy" ] && break
            sleep 5
          done
          docker inspect -f '{{.State.Health.Status}}' sentinelops-ai-kafka-1
      - name: Apply incident-correlator migrations
        working-directory: services/incident-correlator
        run: alembic upgrade head
      - name: Apply rca-agent migrations
        working-directory: services/rca-agent
        run: alembic upgrade head
      - name: Apply remediation-controller migrations
        working-directory: services/remediation-controller
        run: alembic upgrade head
      - name: Integration tests
        run: pytest -m integration
      - if: always()
        run: docker compose down -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build platform API image
        run: docker build -t sentinelops-ai:ci-api .
      - name: Build orders-service image
        run: docker build -f apps/orders-service/Dockerfile -t sentinelops-ai:ci-orders .
      - name: Build ML image
        run: docker build -f ml/Dockerfile -t sentinelops-ai:ci-ml .
      - name: Build incident-correlator image
        run: docker build -f services/incident-correlator/Dockerfile -t sentinelops-ai:ci-incident .
      - name: Build anomaly-detector image
        run: docker build -f services/anomaly-detector/Dockerfile -t sentinelops-ai:ci-detector .
      - name: Build MLflow image
        run: docker build -f docker/mlflow/Dockerfile -t sentinelops-ai:ci-mlflow .
      - name: Build rca-agent image
        run: docker build -f services/rca-agent/Dockerfile -t sentinelops-ai:ci-rca .
      - name: Build remediation-controller image
        run: docker build -f services/remediation-controller/Dockerfile -t sentinelops-ai:ci-remediation .
