name: Deploy EKS
on:
  workflow_dispatch:
    inputs:
      environment: {description: GitHub environment, required: true, default: prod}
permissions: {contents: read, id-token: write}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: azure/setup-helm@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Export Terraform secrets
        run: echo "TF_VAR_db_password=${{ secrets.DB_PASSWORD }}" >> "$GITHUB_ENV"
      - run: terraform init && terraform apply -auto-approve
        working-directory: infrastructure/terraform
      - run: |
          aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"
          helm upgrade --install sentinelops infrastructure/helm/sentinelops -n sentinelops --create-namespace -f infrastructure/helm/sentinelops/values-prod.yaml --wait --timeout 10m
          kubectl rollout status deployment/api -n sentinelops --timeout=5m
      - if: failure()
        run: helm rollback sentinelops 1 -n sentinelops || true
