[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinelops-ai"
version = "0.0.0"
description = "ML-powered, cloud-native incident intelligence platform (monorepo)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Jaineel Hemnani" }]
keywords = ["observability", "incident-management", "anomaly-detection", "mlops", "agentic-ai"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

# The dependency surface grows one phase at a time. Phase 0 added FastAPI +
# config; Phase 1 the Kafka client (aiokafka) + OpenTelemetry. ML (Phase 2),
# database (Phase 3), and LangGraph + the LLM SDK (Phase 4) live in the optional
# groups below so only the services that need them pull them in.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "aiokafka>=0.11",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "opentelemetry-exporter-prometheus>=0.46b0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
# ML anomaly-detection subsystem (Phase 2). Kept out of the API/service runtime
# path — only the ml/ package and its tooling need these.
ml = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "joblib>=1.3",
]
# Incident-correlation persistence (Phase 3). Only the incident-correlator
# service needs a database.
incident = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
]
# Streaming anomaly-detector service (Phase 3): scrapes orders-service /metrics
# over HTTP and reuses the Phase 2 model, so it needs the ml extra too.
detector = [
    "httpx>=0.27",
]
# AI RCA / investigation agent (Phase 4). Owns its own tables (shares the
# incident DB stack), calls the Incident API over HTTP, and runs the bounded
# investigation as a LangGraph state machine. `anthropic` is the live-mode LLM
# provider SDK (Sub-phase 4D); RCA_MODE=mock needs none of it.
rca = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "langgraph>=1.0,<2.0",
    "anthropic>=1.0,<2.0",
]
# Human-approved remediation controller (Phase 5). 5A/5B are pure domain + policy
# (no runtime deps). 5C adds PostgreSQL persistence + an approval HTTP API (the
# API/uvicorn deps are already in the base set). Kafka wiring is a later phase.
remediation = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
]
# MLOps lifecycle (Phase 6): MLflow experiment tracking + model registry. Only
# the *client* is needed here (`mlflow-skinny`) — it logs runs to a tracking URI
# (sqlite / file for tests, an HTTP server in Compose) and drives the registry.
# The full `mlflow` server (and its PostgreSQL driver) runs in its own container
# (docker/mlflow/Dockerfile); `mlflow-skinny` deliberately keeps pandas/numpy at
# the versions Phase 2 was trained and evaluated on.
mlops = [
    "mlflow-skinny>=2.19.0,<2.23.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyyaml>=6.0",  # Phase 7D: validate the Grafana / Prometheus config files
]

[project.urls]
Repository = "https://github.com/Jaineel22/sentinelops-ai"

[tool.hatch.build.targets.wheel]
packages = [
    "libs/sentinelops_common",
    "apps/api/sentinelops_api",
    "apps/orders-service/orders_service",
    "services/anomaly-detector/anomaly_detector",
    "services/incident-correlator/incident_correlator",
    "services/rca-agent/rca_agent",
    "services/remediation-controller/remediation_controller",
    "ml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib -m 'not integration'"
pythonpath = [
    "libs",
    "apps/api",
    "apps/orders-service",
    "services/anomaly-detector",
    "services/incident-correlator",
    "services/rca-agent",
    "services/remediation-controller",
    ".",
]
asyncio_mode = "auto"
markers = [
    "integration: tests that need a running Kafka broker and/or PostgreSQL (deselected by default)",
    "mlflow: Phase 6 tests that exercise a local MLflow backend (run by default; skipped without mlflow)",
]
filterwarnings = [
    # Starlette's TestClient warns that it uses httpx; not actionable for us.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    # mlflow-skinny 2.22 ships a `return` in a `finally` block; upstream wart,
    # surfaces only as a SyntaxWarning on Python 3.14 at import.
    "ignore:'return' in a 'finally' block:SyntaxWarning",
    # mlflow-skinny 2.22 internals still use pre-2.12 Pydantic idioms; upstream.
    "ignore::DeprecationWarning:mlflow",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
    "libs",
    "apps/api",
    "apps/orders-service",
    "services/anomaly-detector",
    "services/incident-correlator",
    "services/rca-agent",
    "services/remediation-controller",
    "ml",
    "tests",
    "scripts",
]
extend-exclude = [
    "services/incident-correlator/migrations",
    "services/rca-agent/migrations",
    "services/remediation-controller/migrations",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "libs",
    "apps/api",
    "apps/orders-service",
    "services/anomaly-detector",
    "services/incident-correlator",
    "services/rca-agent",
    "services/remediation-controller",
    "ml",
    "tests",
    "scripts",
]
mypy_path = [
    "libs",
    "apps/api",
    "apps/orders-service",
    "services/anomaly-detector",
    "services/incident-correlator",
    "services/rca-agent",
    "services/remediation-controller",
]
exclude = [
    "services/incident-correlator/migrations/",
    "services/rca-agent/migrations/",
    "services/remediation-controller/migrations/",
]

[[tool.mypy.overrides]]
# These ship incomplete or no type information.
module = [
    "aiokafka.*",
    "opentelemetry.exporter.prometheus.*",
    "prometheus_client.*",
    "pandas.*",
    "sklearn.*",
    "scipy.*",
    "matplotlib.*",
    "joblib.*",
    "asyncpg.*",
    "alembic.*",
    "langgraph.*",
    "langchain_core.*",
    "yaml.*",
]
ignore_missing_imports = true
