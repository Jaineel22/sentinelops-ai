[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinelops-ai"
version = "0.0.0"
description = "ML-powered, cloud-native incident intelligence platform (monorepo)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Jaineel Hemnani" }]
keywords = ["observability", "incident-management", "anomaly-detection", "mlops", "agentic-ai"]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

# The dependency surface grows one phase at a time. Phase 0 added FastAPI +
# config. Phase 1 adds the Kafka client (aiokafka) and OpenTelemetry. ML, LLM,
# and database libraries are still deferred to the phases that use them.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "aiokafka>=0.11",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "opentelemetry-exporter-prometheus>=0.46b0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
# ML anomaly-detection subsystem (Phase 2). Kept out of the API/service runtime
# path — only the ml/ package and its tooling need these.
ml = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "joblib>=1.3",
]
# Incident-correlation persistence (Phase 3). Only the incident-correlator
# service needs a database.
incident = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
]
# Streaming anomaly-detector service (Phase 3): scrapes orders-service /metrics
# over HTTP and reuses the Phase 2 model, so it needs the ml extra too.
detector = [
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Repository = "https://github.com/Jaineel22/sentinelops-ai"

[tool.hatch.build.targets.wheel]
packages = [
    "libs/sentinelops_common",
    "apps/api/sentinelops_api",
    "apps/orders-service/orders_service",
    "services/anomaly-detector/anomaly_detector",
    "services/incident-correlator/incident_correlator",
    "ml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib -m 'not integration'"
pythonpath = [
    "libs",
    "apps/api",
    "apps/orders-service",
    "services/anomaly-detector",
    "services/incident-correlator",
    ".",
]
asyncio_mode = "auto"
markers = [
    "integration: tests that need a running Kafka broker (deselected by default)",
]
filterwarnings = [
    # Starlette's TestClient warns that it uses httpx; not actionable for us.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
    "libs",
    "apps/api",
    "apps/orders-service",
    "services/anomaly-detector",
    "services/incident-correlator",
    "ml",
    "tests",
    "scripts",
]
extend-exclude = ["services/incident-correlator/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "libs",
    "apps/api",
    "apps/orders-service",
    "services/anomaly-detector",
    "services/incident-correlator",
    "ml",
    "tests",
    "scripts",
]
mypy_path = [
    "libs",
    "apps/api",
    "apps/orders-service",
    "services/anomaly-detector",
    "services/incident-correlator",
]
exclude = ["services/incident-correlator/migrations/"]

[[tool.mypy.overrides]]
# These ship incomplete or no type information.
module = [
    "aiokafka.*",
    "opentelemetry.exporter.prometheus.*",
    "prometheus_client.*",
    "pandas.*",
    "sklearn.*",
    "scipy.*",
    "matplotlib.*",
    "joblib.*",
    "asyncpg.*",
    "alembic.*",
]
ignore_missing_imports = true
