# Local environment (Phases 1 + 3):
#   - api                 the SentinelOps platform API (Phase 0)
#   - kafka               single-node Kafka in KRaft mode (no ZooKeeper) — ADR-006
#   - orders-service      demo app: HTTP -> order.created events -> Kafka + OTel
#   - orders-consumer     demo sink proving producer -> Kafka -> consumer works
#   - postgres            incident state store (Phase 3) — ADR-014
#   - incident-migrate    one-shot: `alembic upgrade head`, then exits
#   - anomaly-detector    scores orders-service telemetry -> anomaly.detected (Phase 3)
#   - incident-correlator anomaly.detected -> incidents (Postgres) + Incident API (Phase 3)
#
# Start everything:            docker compose up --build
# Just the event pipeline:     docker compose up --build kafka orders-service orders-consumer
# Just Phase 3:                docker compose up --build kafka postgres orders-service \
#                                  incident-migrate anomaly-detector incident-correlator
#
# Dev-only Postgres credentials live in this file; never reuse them anywhere real.
# No Redis / Prometheus / Grafana / Loki / Tempo yet — later phases.

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "29092:29092" # host access (traffic generator, integration tests)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  orders-service:
    build:
      context: .
      dockerfile: apps/orders-service/Dockerfile
    ports:
      - "8001:8000"
    environment:
      APP_ENV: development
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ORDERS_TOPIC: orders.events
      OTEL_SERVICE_NAME: orders-service
      # No collector in Phase 1; flip to true to see spans in the container logs.
      OTEL_TRACES_CONSOLE_EXPORT: "false"
      # Failure injection stays disabled by default (ADR-009).
      ORDERS_SIMULATE_LATENCY_MS: "0"
      ORDERS_SIMULATE_ERROR_RATE: "0.0"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  orders-consumer:
    build:
      context: .
      dockerfile: apps/orders-service/Dockerfile
    command: ["python", "-m", "orders_service.consumer"]
    healthcheck:
      disable: true # no HTTP server in the consumer; the image's default check does not apply
    environment:
      APP_ENV: development
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ORDERS_TOPIC: orders.events
      OTEL_SERVICE_NAME: orders-consumer
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432" # host access for integration tests / psql
    environment:
      POSTGRES_USER: sentinelops
      POSTGRES_PASSWORD: sentinelops # dev only — see file header
      POSTGRES_DB: sentinelops
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelops -d sentinelops"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  incident-migrate:
    build:
      context: .
      dockerfile: services/incident-correlator/Dockerfile
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true # one-shot job, exits 0 when the schema is current
    environment:
      DB_URL: postgresql+asyncpg://sentinelops:sentinelops@postgres:5432/sentinelops
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  incident-correlator:
    build:
      context: .
      dockerfile: services/incident-correlator/Dockerfile
    ports:
      - "8002:8000"
    environment:
      APP_ENV: development
      DB_URL: postgresql+asyncpg://sentinelops:sentinelops@postgres:5432/sentinelops
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ANOMALY_TOPIC: anomaly.events
      KAFKA_ANOMALY_DLQ_TOPIC: anomaly.events.dlq
      KAFKA_INCIDENT_TOPIC: incident.events
      KAFKA_CONSUMER_GROUP: incident-correlator
      CORRELATION_WINDOW_SECONDS: "300"
      OTEL_SERVICE_NAME: incident-correlator
      OTEL_TRACES_CONSOLE_EXPORT: "false"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      incident-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  anomaly-detector:
    build:
      context: .
      dockerfile: services/anomaly-detector/Dockerfile
    ports:
      - "8003:8000"
    environment:
      APP_ENV: development
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ANOMALY_TOPIC: anomaly.events
      DETECTOR_TARGET_METRICS_URL: http://orders-service:8000/metrics
      DETECTOR_TARGET_SERVICE: orders-service
      DETECTOR_ENVIRONMENT: development
      DETECTOR_POLL_INTERVAL_SECONDS: "10"
      DETECTOR_MODEL_PATH: /app/artifacts/models/detector_stream.joblib
      OTEL_SERVICE_NAME: anomaly-detector
    depends_on:
      kafka:
        condition: service_healthy
      orders-service:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
