# Local environment (Phases 1 + 3 + 4):
#   - api                 the SentinelOps platform API (Phase 0)
#   - kafka               single-node Kafka in KRaft mode (no ZooKeeper) — ADR-006
#   - orders-service      demo app: HTTP -> order.created events -> Kafka + OTel
#   - orders-consumer     demo sink proving producer -> Kafka -> consumer works
#   - postgres            incident + investigation state store (Phase 3/4) — ADR-014/019
#   - incident-migrate    one-shot: `alembic upgrade head` (incident lineage), then exits
#   - rca-migrate         one-shot: `alembic upgrade head` (rca lineage, alembic_version_rca)
#   - anomaly-detector    scores orders-service telemetry -> anomaly.detected (Phase 3)
#   - incident-correlator anomaly.detected -> incidents (Postgres) + Incident API (Phase 3)
#   - rca-agent           incident.opened -> bounded RCA investigation + Investigation API (Phase 4)
#   - remediation-migrate one-shot: `alembic upgrade head` (alembic_version_remediation)
#   - remediation-controller  RCA recommendation -> policy -> human approval ->
#                             LocalSimulationExecutor -> audit -> recovery verify
#                             -> remediation.events lifecycle events (Phase 5C-5G).
#                             No real infra; publishes to Kafka, consumes nothing.
#
# Start everything:            docker compose up --build
# Just the event pipeline:     docker compose up --build kafka orders-service orders-consumer
# Just Phase 3:                docker compose up --build kafka postgres orders-service \
#                                  incident-migrate anomaly-detector incident-correlator
# Phase 4 too:                 docker compose up --build   (adds rca-migrate + rca-agent)
# Phase 5 too:                 docker compose up --build   (adds remediation-migrate +
#                              remediation-controller; publishes remediation.events)
#
# rca-agent defaults to RCA_MODE=mock — the whole chain runs with NO LLM API key.
# For a live run: set RCA_MODE=live, LLM_PROVIDER=anthropic and LLM_API_KEY in your
# shell (compose reads it from the environment; it is never committed here).
#
#   - mlflow-init         one-shot: create the `mlflow` database on Postgres if missing
#   - mlflow              MLflow tracking + model-registry server (Phase 6) — http://localhost:5000
#   - prometheus          scrapes the anomaly-detector `/metrics` (Phase 7D) — http://localhost:9090
#   - grafana             "Anomaly Detector - Inference & Performance" dashboard (Phase 7D) —
#                         http://localhost:3000 (admin/admin)
#
# Dev-only Postgres / Grafana credentials live in this file; never reuse them anywhere real.
# No Redis / Loki / Tempo yet — later phases.

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "29092:29092" # host access (traffic generator, integration tests)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  orders-service:
    build:
      context: .
      dockerfile: apps/orders-service/Dockerfile
    ports:
      - "8001:8000"
    environment:
      APP_ENV: development
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ORDERS_TOPIC: orders.events
      OTEL_SERVICE_NAME: orders-service
      # No collector in Phase 1; flip to true to see spans in the container logs.
      OTEL_TRACES_CONSOLE_EXPORT: "false"
      # Failure injection stays disabled by default (ADR-009).
      ORDERS_SIMULATE_LATENCY_MS: "0"
      ORDERS_SIMULATE_ERROR_RATE: "0.0"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  orders-consumer:
    build:
      context: .
      dockerfile: apps/orders-service/Dockerfile
    command: ["python", "-m", "orders_service.consumer"]
    healthcheck:
      disable: true # no HTTP server in the consumer; the image's default check does not apply
    environment:
      APP_ENV: development
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ORDERS_TOPIC: orders.events
      OTEL_SERVICE_NAME: orders-consumer
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432" # host access for integration tests / psql
    environment:
      POSTGRES_USER: sentinelops
      POSTGRES_PASSWORD: sentinelops # dev only — see file header
      POSTGRES_DB: sentinelops
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelops -d sentinelops"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  incident-migrate:
    build:
      context: .
      dockerfile: services/incident-correlator/Dockerfile
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true # one-shot job, exits 0 when the schema is current
    environment:
      DB_URL: postgresql+asyncpg://sentinelops:sentinelops@postgres:5432/sentinelops
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  incident-correlator:
    build:
      context: .
      dockerfile: services/incident-correlator/Dockerfile
    ports:
      - "8002:8000"
    environment:
      APP_ENV: development
      DB_URL: postgresql+asyncpg://sentinelops:sentinelops@postgres:5432/sentinelops
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ANOMALY_TOPIC: anomaly.events
      KAFKA_ANOMALY_DLQ_TOPIC: anomaly.events.dlq
      KAFKA_INCIDENT_TOPIC: incident.events
      KAFKA_CONSUMER_GROUP: incident-correlator
      CORRELATION_WINDOW_SECONDS: "300"
      OTEL_SERVICE_NAME: incident-correlator
      OTEL_TRACES_CONSOLE_EXPORT: "false"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      incident-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  rca-migrate:
    build:
      context: .
      dockerfile: services/rca-agent/Dockerfile
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true # one-shot job, exits 0 when the rca schema is current
    environment:
      DB_URL: postgresql+asyncpg://sentinelops:sentinelops@postgres:5432/sentinelops
    depends_on:
      postgres:
        condition: service_healthy
      incident-migrate:
        condition: service_completed_successfully # serialize the two lineages
    restart: "no"

  rca-agent:
    build:
      context: .
      dockerfile: services/rca-agent/Dockerfile
    ports:
      - "8004:8000"
    environment:
      APP_ENV: development
      DB_URL: postgresql+asyncpg://sentinelops:sentinelops@postgres:5432/sentinelops
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_INCIDENT_TOPIC: incident.events
      KAFKA_INCIDENT_DLQ_TOPIC: incident.events.dlq
      KAFKA_CONSUMER_GROUP: rca-agent
      # mock = deterministic, no LLM API key needed. Override to "live" + set
      # LLM_PROVIDER / LLM_API_KEY for a real provider (ADR-022).
      RCA_MODE: ${RCA_MODE:-mock}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_API_KEY: ${LLM_API_KEY:-}
      RCA_INCIDENT_API_BASE_URL: http://incident-correlator:8000
      OTEL_SERVICE_NAME: rca-agent
      OTEL_TRACES_CONSOLE_EXPORT: "false"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rca-migrate:
        condition: service_completed_successfully
      incident-correlator:
        condition: service_started # needs the Incident API reachable during investigations
    restart: unless-stopped

  remediation-migrate:
    build:
      context: .
      dockerfile: services/remediation-controller/Dockerfile
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true # one-shot job, exits 0 when the remediation schema is current
    environment:
      DB_URL: postgresql+asyncpg://sentinelops:sentinelops@postgres:5432/sentinelops
    depends_on:
      postgres:
        condition: service_healthy
      rca-migrate:
        condition: service_completed_successfully # serialize the three lineages
    restart: "no"

  remediation-controller:
    build:
      context: .
      dockerfile: services/remediation-controller/Dockerfile
    ports:
      - "8005:8000"
    environment:
      APP_ENV: development
      DB_URL: postgresql+asyncpg://sentinelops:sentinelops@postgres:5432/sentinelops
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_REMEDIATION_TOPIC: remediation.events
      OTEL_SERVICE_NAME: remediation-controller
      OTEL_TRACES_CONSOLE_EXPORT: "false"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      remediation-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Phase 5G: publishes remediation.events lifecycle events after each committed
    # transition (best-effort, ADR-030). It consumes NO topic. The only executor
    # is LocalSimulationExecutor (Phase 5D) — it touches no real infrastructure.

  anomaly-detector:
    build:
      context: .
      dockerfile: services/anomaly-detector/Dockerfile
    ports:
      - "8003:8000"
    environment:
      APP_ENV: development
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ANOMALY_TOPIC: anomaly.events
      DETECTOR_TARGET_METRICS_URL: http://orders-service:8000/metrics
      DETECTOR_TARGET_SERVICE: orders-service
      DETECTOR_ENVIRONMENT: development
      DETECTOR_POLL_INTERVAL_SECONDS: "10"
      DETECTOR_MODEL_PATH: /app/artifacts/models/detector_stream.joblib
      OTEL_SERVICE_NAME: anomaly-detector
      # Phase 6C: empty by default -> loads the local bundle exactly as before.
      # Set MLFLOW_TRACKING_URI=http://mlflow:5000 (in your shell / .env) to
      # resolve the `champion` model version from the registry instead; with
      # MLFLOW_REQUIRED=false an unreachable registry falls back to local
      # (logged), with =true the detector's /ready reports 503.
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-}
      MLFLOW_REGISTERED_MODEL_NAME: ${MLFLOW_REGISTERED_MODEL_NAME:-sentinelops-anomaly-detector}
      MLFLOW_MODEL_ALIAS: ${MLFLOW_MODEL_ALIAS:-champion}
      MLFLOW_REQUIRED: ${MLFLOW_REQUIRED:-false}
    depends_on:
      kafka:
        condition: service_healthy
      orders-service:
        condition: service_started
    restart: unless-stopped

  # --- Phase 6: MLflow (experiment tracking + model registry) ----------------
  # Backend store: a dedicated `mlflow` database on the existing Postgres.
  # Artifact store: the `mlflow-artifacts` volume, served over HTTP by the
  # tracking server (`--serve-artifacts`) so clients never need a shared mount.
  # UI + API: http://localhost:5000. Nothing in Phases 1-5 depends on this
  # service; the anomaly-detector keeps starting if MLflow is down (Phase 6C).
  mlflow-init:
    image: postgres:17-alpine
    entrypoint:
      - sh
      - -c
      - >-
        until pg_isready -h postgres -U sentinelops; do sleep 1; done;
        psql -h postgres -U sentinelops -tc "SELECT 1 FROM pg_database WHERE datname='mlflow'" | grep -q 1
        || psql -h postgres -U sentinelops -c "CREATE DATABASE mlflow";
        echo "mlflow database ready"
    environment:
      PGPASSWORD: sentinelops # dev only — matches the postgres service
    healthcheck:
      disable: true # one-shot job, exits 0 once the mlflow database exists
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql://sentinelops:sentinelops@postgres:5432/mlflow
      - --serve-artifacts
      - --artifacts-destination=/mlflow/artifacts
      - --workers=2
    ports:
      - "5000:5000"
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health').getcode()==200 else 1)
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      mlflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # --- Phase 7D: metrics backend + dashboards --------------------------------
  # Prometheus scrapes the anomaly-detector's OTel->Prometheus `/metrics`
  # (Phases 7A-7C); Grafana renders the provisioned "Anomaly Detector -
  # Inference & Performance" dashboard. Nothing else depends on these; the app
  # keeps running if they are down.
  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      anomaly-detector:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/etc/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin # dev only — see file header
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  mlflow-artifacts:
  prometheus-data:
  grafana-data:
