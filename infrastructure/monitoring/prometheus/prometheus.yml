# Prometheus scrape config for the SentinelOps local stack (Phase 7D).
#
# Only the anomaly-detector is scraped for now — it is the first service with a
# purpose-built inference/latency metric surface (Phases 7A–7C). Other services
# already expose `/metrics` in the same OTel→Prometheus shape and can be added
# here one job at a time.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "anomaly-detector"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets: ["anomaly-detector:8000"] # in-compose port; host maps it to :8003
    relabel_configs:
      # collapse "anomaly-detector:8000" -> "anomaly-detector" for a stable
      # `instance` label the dashboard's uptime panel keys on.
      - source_labels: [__address__]
        target_label: instance
        regex: "([^:]+).*"
        replacement: "${1}"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
