apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sentinelops
  namespace: sentinelops
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend: {service: {name: api, port: {number: 8000}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: frontend, port: {number: 3000}}}
  # Add tls.secretName after cert-manager is installed.
