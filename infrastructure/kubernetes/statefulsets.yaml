apiVersion: apps/v1
kind: StatefulSet
metadata: {name: kafka, namespace: sentinelops}
spec:
  serviceName: kafka-headless
  replicas: 1
  selector: {matchLabels: {app: kafka}}
  template:
    metadata: {labels: {app: kafka}}
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.9.1
          ports: [{name: kafka, containerPort: 9092}]
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: broker,controller}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: 1@localhost:9093}
            - {name: KAFKA_LISTENERS, value: PLAINTEXT://:9092,CONTROLLER://:9093}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: PLAINTEXT://kafka:9092}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
          volumeMounts: [{name: data, mountPath: /var/lib/kafka/data}]
          readinessProbe: {tcpSocket: {port: kafka}, initialDelaySeconds: 15}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: ["ReadWriteOnce"], resources: {requests: {storage: 10Gi}}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: sentinelops}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_USER, valueFrom: {secretKeyRef: {name: sentinelops-secrets, key: DB_USERNAME}}}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: sentinelops-secrets, key: DB_PASSWORD}}}
            - {name: POSTGRES_DB, valueFrom: {configMapKeyRef: {name: sentinelops-config, key: DB_NAME}}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
          readinessProbe: {exec: {command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]}, initialDelaySeconds: 10}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: ["ReadWriteOnce"], resources: {requests: {storage: 20Gi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mlflow, namespace: sentinelops}
spec:
  replicas: 1
  selector: {matchLabels: {app: mlflow}}
  template:
    metadata: {labels: {app: mlflow}}
    spec:
      containers:
        - name: mlflow
          image: sentinelops-ai/mlflow:latest
          args: ["mlflow", "server", "--host=0.0.0.0", "--port=5000", "--serve-artifacts"]
          ports: [{name: http, containerPort: 5000}]
          env:
            - {name: MLFLOW_BACKEND_STORE_URI, value: "******postgres:5432/mlflow"}
          volumeMounts: [{name: artifacts, mountPath: /mlflow/artifacts}]
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 30}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 1Gi}}
      volumes:
        - name: artifacts
          persistentVolumeClaim: {claimName: mlflow-artifacts}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: mlflow-artifacts, namespace: sentinelops}
spec: {accessModes: ["ReadWriteOnce"], resources: {requests: {storage: 20Gi}}}
