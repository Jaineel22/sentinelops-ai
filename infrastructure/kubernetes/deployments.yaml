apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: sentinelops}
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - name: api
          image: sentinelops-ai/api:latest
          ports: [{name: http, containerPort: 8000}]
          envFrom: [{configMapRef: {name: sentinelops-config}}, {secretRef: {name: sentinelops-secrets}}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 30}
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 10}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: orders-service, namespace: sentinelops}
spec:
  replicas: 1
  selector: {matchLabels: {app: orders-service}}
  template:
    metadata: {labels: {app: orders-service}}
    spec:
      containers:
        - name: orders-service
          image: sentinelops-ai/orders-service:latest
          ports: [{name: http, containerPort: 8000}]
          envFrom: [{configMapRef: {name: sentinelops-config}}]
          env: [{name: ORDERS_SIMULATE_LATENCY_MS, value: "0"}, {name: ORDERS_SIMULATE_ERROR_RATE, value: "0"}]
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 30}
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 10}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: anomaly-detector, namespace: sentinelops}
spec:
  replicas: 1
  selector: {matchLabels: {app: anomaly-detector}}
  template:
    metadata: {labels: {app: anomaly-detector}}
    spec:
      containers:
        - name: anomaly-detector
          image: sentinelops-ai/anomaly-detector:latest
          ports: [{name: http, containerPort: 8000}]
          envFrom: [{configMapRef: {name: sentinelops-config}}, {secretRef: {name: sentinelops-secrets}}]
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 1Gi}}
