          readinessProbe: {httpGet: {path: /ready, port: http}, initialDelaySeconds: 30}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: incident-correlator, namespace: sentinelops}
spec:
  replicas: 1
  selector: {matchLabels: {app: incident-correlator}}
  template:
    metadata: {labels: {app: incident-correlator}}
    spec:
      containers:
        - name: incident-correlator
          image: sentinelops-ai/incident-correlator:latest
          ports: [{name: http, containerPort: 8000}]
          envFrom: [{configMapRef: {name: sentinelops-config}}, {secretRef: {name: sentinelops-secrets}}]
          env: [{name: DB_URL, value: "******$(DB_USERNAME):$(DB_PASSWORD)@postgres:5432/$(DB_NAME)"}]
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 30}
          readinessProbe: {httpGet: {path: /ready, port: http}, initialDelaySeconds: 30}
---
